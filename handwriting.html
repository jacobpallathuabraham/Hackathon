  <title>Handwriting Studio · ERLY</title>
  <meta name="description" content="ERLY Handwriting Studio: write, draw, paint, practise letters and numbers, plot graphs and build science diagrams with a natural ink engine. Notebooks stay on your device; recognition runs in your browser.">
  <link rel="icon" href="assets/img/mark.svg" type="image/svg+xml">
  <script>
    // theme, language and the arriving ink are applied before the first paint: no flash of the wrong theme
    try { var r = sessionStorage.getItem('acubins-role'); if (!r) { var s = JSON.parse(localStorage.getItem('acubins-session') || 'null'); if (s && s.exp > Date.now() && s.role) { r = s.role; sessionStorage.setItem('acubins-role', r); } } if (r !== 'student') location.replace('login.html?next=student&back=' + encodeURIComponent(location.pathname.split('/').pop() + location.search + location.hash)); } catch (e) {}
    (function () {
      try {
        var t = localStorage.getItem('erly-theme');
        if (!t || t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
        var ac = localStorage.getItem('erly-accent'); if (ac && ac !== 'terracotta') document.documentElement.dataset.accent = ac;
        if (localStorage.getItem('erly-lang') === 'ar') { document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl'; }
        var f = JSON.parse(sessionStorage.getItem('erly-ink') || 'null');
        if (f && Date.now() - f.at < 8000) document.documentElement.classList.add('ink-arrive');
        // the liquid ink is this page's entrance: skip the browser's cross-fade then, and never leave its promises unhandled
        addEventListener('pagereveal', function (e) { var vt = e.viewTransition; if (!vt) return; [vt.ready, vt.finished, vt.updateCallbackDone].forEach(function (p) { if (p) p.catch(function () {}); }); if (document.documentElement.classList.contains('ink-arrive')) vt.skipTransition(); });
      } catch (e) {}
    })();
  </script>

  <script>
    (function () {
      const bus = {}; let tt;
      window.ERLY = {
        on(e, f) { (bus[e] = bus[e] || []).push(f); }, emit(e, d) { (bus[e] || []).forEach(f => f(d)); },
        toast(msg) { const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('is-on'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('is-on'), 2800); }
      };
      I18N.apply(I18N.lang);
    })();
  </script>
