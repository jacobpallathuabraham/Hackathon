<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>ERLY video stage (build tool)</title>
<meta name="robots" content="noindex">
<style>html,body{margin:0;background:#fff}canvas{display:block}</style></head>
<body>
<!-- Build tool for tools/make-learn-videos.js: paints one frame of an ERLY video lesson at time t.
     Not part of the site. Animation is a pure function of (video, t, narration timeline). -->
<canvas id="c" width="960" height="540"></canvas>
<svg id="paths" width="0" height="0" style="position:absolute"></svg>
<script>
'use strict';
const W = 960, H = 540, cv = document.getElementById('c'), g = cv.getContext('2d');
const C = { bg: '#FBF8F2', ink: '#1B1915', muted: '#6E675B', line: '#DDD4C4', accent: '#BA4A26', teal: '#146A63', deo: '#3D6FC4', deoF: '#C9D6EE', oxy: '#C8443A', oxyF: '#F0CBC6', violet: '#5B4B8A' };
const ease = u => (u < 0 ? 0 : u > 1 ? 1 : u * u * (3 - 2 * u));
const lerp = (a, b, u) => a + (b - a) * u;
function at(tl, t) { let i = tl.findIndex(x => t < x.end); if (i < 0) i = tl.length - 1; const x = tl[i]; return { i, cue: x.cue, u: Math.max(0, Math.min(1, (t - x.start) / Math.max(0.01, x.end - x.start))), chapter: x.chapter, title: x.title, cues: tl.slice(0, i).map(y => y.cue) }; }
function frame(title, chapterNo) {
  g.fillStyle = C.bg; g.fillRect(0, 0, W, H);
  g.fillStyle = C.accent; g.font = '700 13px "Instrument Sans", system-ui, sans-serif'; g.fillText(('CHAPTER ' + (chapterNo + 1)).toUpperCase(), 40, 44);
  g.fillStyle = C.ink; g.font = '500 30px Georgia, "Iowan Old Style", serif'; g.fillText(title, 40, 80);
  g.fillStyle = C.muted; g.font = '600 12px system-ui, sans-serif'; g.textAlign = 'right'; g.fillText('ERLY · Learning Studio', W - 30, 40); g.textAlign = 'left';
}
function label(x, y, s, col, size, align) { g.fillStyle = col || C.ink; g.font = `600 ${size || 15}px system-ui, sans-serif`; g.textAlign = align || 'left'; g.fillText(s, x, y); g.textAlign = 'left'; }
function arrow(x0, y0, x1, y1, col, w) { const a = Math.atan2(y1 - y0, x1 - x0); g.strokeStyle = g.fillStyle = col; g.lineWidth = w || 3; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke(); g.beginPath(); g.moveTo(x1, y1); g.lineTo(x1 - 12 * Math.cos(a - 0.4), y1 - 12 * Math.sin(a - 0.4)); g.lineTo(x1 - 12 * Math.cos(a + 0.4), y1 - 12 * Math.sin(a + 0.4)); g.closePath(); g.fill(); }

/* ---------------- heart (same geometry as the lesson diagram, assets/js/learn/ls-figures.js) ---------------- */
const HP = { svc: 'M96 18 h30 v104 h-30z', ivc: 'M38 352 v-196 a12 12 0 0 1 12 -12 h22 v26 h-8 v182z', pa: 'M162 214 V62 h-46 v-26 h120 v26 h-48 V214z', ao: 'M212 216 V70 C212 30 240 18 276 18 C336 18 364 30 364 66 V112 h-26 V68 C338 52 322 44 276 44 C252 44 238 54 238 76 V216z', pv: 'M330 132 h56 v20 h-56z M330 170 h56 v20 h-56z',
  ra: 'M102 118 h28 a30 30 0 0 1 30 30 v32 a30 30 0 0 1 -30 30 h-28 a30 30 0 0 1 -30 -30 v-32 a30 30 0 0 1 30 -30z', rv: 'M72 216 H196 V318 C160 352 108 344 82 300 C74 284 72 262 72 246Z', la: 'M276 118 h26 a30 30 0 0 1 30 30 v32 a30 30 0 0 1 -30 30 h-26 a30 30 0 0 1 -30 -30 v-32 a30 30 0 0 1 30 -30z', lv: 'M206 216 H340 C346 270 318 336 236 352 C220 352 210 346 206 336Z' };
const FLOW = { deo: ['M111 40 V112', 'M110 150 V246', 'M150 300 C176 290 180 260 176 200 V60', 'M176 48 H124'], ivc: ['M52 330 V196 Q52 176 74 170'], oxy: ['M384 142 H336', 'M290 150 V244', 'M260 312 C238 300 226 270 225 220 V84 C226 56 246 32 276 31 C330 31 351 46 351 70 V108'] };
const svgNS = 'http://www.w3.org/2000/svg', psvg = document.getElementById('paths');
function sampler(d) { const p = document.createElementNS(svgNS, 'path'); p.setAttribute('d', d); psvg.appendChild(p); const L = p.getTotalLength(); return u => { const q = p.getPointAtLength(L * u); return [q.x, q.y]; }; }
const routes = {}; Object.entries(FLOW).forEach(([k, arr]) => { routes[k] = arr.map(sampler); });
function heart(hl, flows, t, ox, oy, k) {
  g.save(); g.translate(ox, oy); g.scale(k, k);
  const fill = (d, f, s, lw) => { const p = new Path2D(d); g.fillStyle = f; g.fill(p); g.strokeStyle = s; g.lineWidth = lw; g.stroke(p); };
  const on = id => !hl || hl.includes(id);
  const dim = (id, f) => (on(id) ? f : '#ECE7DD');
  fill(HP.svc, dim('vc', C.deoF), C.deo, 2); fill(HP.ivc, dim('vc', C.deoF), C.deo, 2); fill(HP.pa, dim('pa', C.deoF), C.deo, 2); fill(HP.ao, dim('ao', C.oxyF), C.oxy, 2); fill(HP.pv, dim('pv', C.oxyF), C.oxy, 2);
  fill(HP.ra, dim('ra', C.deoF), C.deo, 2); fill(HP.rv, dim('rv', C.deoF), C.deo, 2); fill(HP.la, dim('la', C.oxyF), C.oxy, 2); fill(HP.lv, dim('lv', C.oxyF), C.oxy, hl && hl.includes('wall') ? 9 : 6);
  g.strokeStyle = C.ink; g.lineWidth = 5; g.lineCap = 'round'; g.beginPath(); g.moveTo(201, 118); g.lineTo(201, 350); g.stroke();
  g.setLineDash([8, 6]); g.lineWidth = 3; g.beginPath(); g.moveTo(86, 213); g.lineTo(146, 213); g.moveTo(232, 213); g.lineTo(322, 213); g.stroke(); g.setLineDash([]);
  (flows || []).forEach(([key, col]) => routes[key].forEach((s, j) => { for (let n = 0; n < 4; n++) { const u = ((t * 0.32 + n / 4 + j * 0.13) % 1); const [x, y] = s(u); g.fillStyle = col; g.beginPath(); g.arc(x, y, 6, 0, 7); g.fill(); g.strokeStyle = '#fff'; g.lineWidth = 1.5; g.stroke(); } }));
  g.restore();
}
const HX = 60, HY = 100, HK = 1.08;
const P = (x, y) => [HX + x * HK, HY + y * HK];
function hlabel(x, y, s, col, tx, ty) { const [a, b] = P(x, y); const [c2, d] = [tx, ty]; g.strokeStyle = col; g.lineWidth = 1.5; g.beginPath(); g.moveTo(a, b); g.lineTo(c2 - 6, d - 5); g.stroke(); label(c2, d, s, col, 17); }
function panel(lines, y0) { let y = y0 || 150; lines.forEach(([s, col, size]) => { label(560, y, s, col || C.ink, size || 19); y += (size || 19) + 14; }); }

const PAINT = {
  'erly-heart'(t, tl) {
    const a = at(tl, t); frame(a.title, a.chapter); const seen = a.cues.concat([a.cue]);
    if (a.chapter === 3) { // two loops
      const cx = 300, cy = 300;
      g.fillStyle = '#EEF3EC'; g.strokeStyle = C.teal; g.lineWidth = 2; g.beginPath(); g.roundRect(cx - 110, 115, 220, 60, 14); g.fill(); g.stroke(); label(cx, 152, 'Lungs', C.teal, 20, 'center');
      g.fillStyle = '#F3EEE6'; g.strokeStyle = C.muted; g.beginPath(); g.roundRect(cx - 110, 425, 220, 60, 14); g.fill(); g.stroke(); label(cx, 462, 'Body', C.muted, 20, 'center');
      g.fillStyle = C.deoF; g.strokeStyle = C.deo; g.beginPath(); g.roundRect(cx - 120, 255, 110, 90, 14); g.fill(); g.stroke(); label(cx - 65, 305, 'Right side', C.deo, 15, 'center');
      g.fillStyle = C.oxyF; g.strokeStyle = C.oxy; g.beginPath(); g.roundRect(cx + 10, 255, 110, 90, 14); g.fill(); g.stroke(); label(cx + 65, 305, 'Left side', C.oxy, 15, 'center');
      const loop = [[cx - 65, 255, cx - 65, 180, C.deo], [cx + 65, 180, cx + 65, 255, C.oxy], [cx + 65, 345, cx + 65, 420, C.oxy], [cx - 65, 420, cx - 65, 350, C.deo]];
      loop.forEach(([x0, y0, x1, y1, col]) => arrow(x0, y0, x1, y1, col, 4));
      const u = (t * 0.25) % 1, pts = [[cx - 65, 420], [cx - 65, 255], [cx - 65, 180], [cx + 65, 180], [cx + 65, 345], [cx + 65, 420]]; for (let n = 0; n < 6; n++) { const v = (u + n / 6) % 1, seg = v * (pts.length - 1), i = Math.floor(seg), f = seg - i, p0 = pts[i], p1 = pts[Math.min(i + 1, pts.length - 1)]; g.fillStyle = i < 2 ? C.deo : C.oxy; g.beginPath(); g.arc(lerp(p0[0], p1[0], f), lerp(p0[1], p1[1], f), 7, 0, 7); g.fill(); }
      panel([['Pulmonary circuit', C.deo, 20], ['right ventricle → lungs → left atrium', C.ink, 16], ['', 0, 8], ['Systemic circuit', C.oxy, 20], ['left ventricle → body → right atrium', C.ink, 16], ['', 0, 8], ...(seen.includes('recap') ? [['Arteries: away from the heart', C.teal, 18], ['Veins: back to the heart', C.teal, 18]] : seen.includes('loops2') ? [['Valves keep flow one way', C.ink, 18]] : [])], 170);
      return;
    }
    const hl = a.chapter === 0 ? (a.cue === 'atria' ? ['ra', 'la'] : a.cue === 'ventricles' ? ['rv', 'lv'] : null) : a.chapter === 1 ? ['vc', 'ra', 'rv', 'pa'] : ['pv', 'la', 'lv', 'ao', ...(a.cue === 'oxy3' ? ['wall'] : [])];
    const flows = a.chapter === 1 ? [['deo', C.deo], ['ivc', C.deo]].filter(() => true) : a.chapter === 2 ? [['oxy', C.oxy]] : [];
    heart(hl, flows, t, HX, HY, HK);
    if (a.chapter === 0) {
      if (seen.includes('atria')) { hlabel(116, 160, 'Right atrium', C.deo, 560, 200); hlabel(300, 160, 'Left atrium', C.oxy, 560, 232); }
      if (seen.includes('ventricles')) { hlabel(130, 280, 'Right ventricle', C.deo, 560, 280); hlabel(280, 290, 'Left ventricle', C.oxy, 560, 312); }
      if (seen.includes('sides')) { label(HX + 130 * HK, HY + 410, 'heart’s RIGHT', C.deo, 15, 'center'); label(HX + 280 * HK, HY + 410, 'heart’s LEFT', C.oxy, 15, 'center'); panel([['Facing the person:', C.muted, 16], ['their right is your left', C.ink, 18]], 380); }
      if (a.cue === 'intro') panel([['Two pumps,', C.ink, 26], ['side by side', C.ink, 26]], 230);
    } else if (a.chapter === 1) {
      panel([['Oxygen-poor blood', C.deo, 22], ...['vena cava', 'right atrium', 'tricuspid valve', 'right ventricle', 'pulmonary artery', 'lungs'].map((s, i) => [(i ? '→ ' : '') + s, ['deo1', 'deo1', 'deo2', 'deo2', 'deo3', 'lungs'].slice(0, i + 1).every(c => seen.includes(c)) ? C.ink : C.line, 18])], 150);
      if (seen.includes('lungs')) panel([['+ O₂   − CO₂', C.teal, 22]], 450);
    } else {
      panel([['Oxygen-rich blood', C.oxy, 22], ...['pulmonary veins', 'left atrium', 'mitral valve', 'left ventricle', 'aorta', 'whole body'].map((s, i) => [(i ? '→ ' : '') + s, ['oxy1', 'oxy1', 'oxy2', 'oxy2', 'oxy3', 'oxy3'].slice(0, i + 1).every(c => seen.includes(c)) ? C.ink : C.line, 18])], 150);
      if (a.cue === 'oxy3') panel([['thickest wall → highest pressure', C.oxy, 17]], 450);
    }
  },
  'erly-quad'(t, tl) {
    const a = at(tl, t); frame(a.title, a.chapter); const u = ease(a.u);
    let A = 1, B = 0, Cc = 0, showRoots = false, showV = a.cue === 'vertex';
    if (a.cue === 'a1') A = lerp(1, 3, u); if (a.cue === 'a2') A = lerp(3, 0.3, u); if (a.cue === 'a3') A = lerp(0.3, -1, u);
    if (a.cue === 'c1') { A = 1; Cc = 3 * Math.sin(u * Math.PI * 2); } if (a.cue === 'c2') { A = 1; Cc = lerp(0, 2, u); }
    if (a.cue === 'roots') { A = 1; B = -2; Cc = -3; showRoots = true; } if (a.cue === 'disc') { A = 1; B = -2; Cc = -3; showRoots = true; }
    if (a.cue === 'disc2') { A = 1; B = -2; Cc = u < 0.33 ? -3 : u < 0.66 ? 1 : 3; showRoots = true; }
    const ox = 300, oy = 330, s = 38; // plot
    g.save(); g.beginPath(); g.rect(60, 110, 480, 400); g.clip();
    g.strokeStyle = C.line; g.lineWidth = 1; for (let x = -6; x <= 6; x++) { g.beginPath(); g.moveTo(ox + x * s, 110); g.lineTo(ox + x * s, 510); g.stroke(); } for (let y = -5; y <= 6; y++) { g.beginPath(); g.moveTo(60, oy - y * s); g.lineTo(540, oy - y * s); g.stroke(); }
    g.strokeStyle = C.muted; g.lineWidth = 2; g.beginPath(); g.moveTo(60, oy); g.lineTo(540, oy); g.moveTo(ox, 110); g.lineTo(ox, 510); g.stroke();
    g.strokeStyle = C.accent; g.lineWidth = 4; g.beginPath(); for (let i = 0; i <= 300; i++) { const x = -7 + 14 * i / 300, y = A * x * x + B * x + Cc; const X = ox + x * s, Y = oy - y * s; i ? g.lineTo(X, Y) : g.moveTo(X, Y); } g.stroke();
    const vx = -B / (2 * A), vy = A * vx * vx + B * vx + Cc;
    if (showV || a.chapter === 1) { g.fillStyle = C.violet; g.beginPath(); g.arc(ox + vx * s, oy - vy * s, 7, 0, 7); g.fill(); }
    if (a.chapter === 2) { g.fillStyle = C.teal; g.beginPath(); g.arc(ox, oy - Cc * s, 7, 0, 7); g.fill(); }
    const D = B * B - 4 * A * Cc;
    if (showRoots && D >= 0) { [(-B - Math.sqrt(D)) / (2 * A), (-B + Math.sqrt(D)) / (2 * A)].forEach(r => { g.fillStyle = C.teal; g.beginPath(); g.arc(ox + r * s, oy, 8, 0, 7); g.fill(); }); }
    g.restore();
    const f = v => (Math.abs(v) < 0.005 ? '0' : (+v.toFixed(2)).toString());
    panel([[`y = ${Math.abs(A - 1) < 0.005 ? '' : Math.abs(A + 1) < 0.005 ? '−' : f(A)}x²${B ? (B > 0 ? ' + ' : ' − ') + f(Math.abs(B)) + 'x' : ''}${Cc ? (Cc > 0 ? ' + ' : ' − ') + f(Math.abs(Cc)) : ''}`, C.ink, 26], ['', 0, 4],
      [`a = ${f(A)}   ${A < 0 ? '(opens down)' : '(opens up)'}`, A < 0 ? C.accent : C.ink, 18], [`c = ${f(Cc)}   (y-intercept)`, a.chapter === 2 ? C.teal : C.ink, 18],
      ...(showV || a.chapter === 1 ? [[`vertex (${f(vx)}, ${f(vy)})`, C.violet, 18]] : []),
      ...(a.chapter === 3 ? [[`Δ = b² − 4ac = ${f(D)}`, C.ink, 20], [D > 0.001 ? 'two real roots' : Math.abs(D) <= 0.001 ? 'one repeated root' : 'no real roots', C.teal, 20], ...(D >= 0 ? [[`x = ${f((-B - Math.sqrt(D)) / (2 * A))}, ${f((-B + Math.sqrt(D)) / (2 * A))}`, C.teal, 18]] : [])] : [])], 160);
  },
  'erly-newton'(t, tl) {
    const a = at(tl, t); frame(a.title, a.chapter);
    const seg = tl.filter(x => x.chapter === a.chapter), t0 = seg[0].start, lt = t - t0;
    const m = a.chapter === 2 ? 4 : a.chapter === 3 ? 6 : 2, F = a.chapter === 0 ? 20 : a.chapter === 3 ? 42 : 40, fr = a.chapter === 3 ? 12 : 20, net = F - fr, acc = net / m;
    const v0 = 1.2, v = v0 + acc * lt * 0.18, x = (v0 * lt + 0.5 * acc * 0.18 * lt * lt) * 26 % 380;
    g.strokeStyle = C.muted; g.lineWidth = 3; g.beginPath(); g.moveTo(40, 400); g.lineTo(560, 400); g.stroke(); for (let i = 0; i < 26; i++) { g.beginPath(); g.moveTo(40 + i * 20, 400); g.lineTo(30 + i * 20, 412); g.stroke(); }
    const bw = 70 + m * 9, bx = 80 + x, by = 400 - bw * 0.7;
    g.fillStyle = '#E9D9C6'; g.strokeStyle = C.ink; g.lineWidth = 2; g.beginPath(); g.roundRect(bx, by, bw, bw * 0.7, 8); g.fill(); g.stroke(); label(bx + bw / 2, by + bw * 0.38, m + ' kg', C.ink, 17, 'center');
    arrow(bx - 70 - F * 1.2 + 70, by + bw * 0.35, bx - 4, by + bw * 0.35, C.accent, 5); label(Math.max(44, bx - F * 1.2), by - 10, `push ${F} N`, C.accent, 15);
    arrow(bx + bw + 4 + fr * 1.6, 392, bx + bw + 4, 392, C.teal, 4); label(bx + bw + 8, 380, `friction ${fr} N`, C.teal, 14);
    // v–t graph
    const gx = 580, gy = 330, gw = 330, gh = 160; g.strokeStyle = C.muted; g.lineWidth = 1.5; g.beginPath(); g.moveTo(gx, gy - gh); g.lineTo(gx, gy); g.lineTo(gx + gw, gy); g.stroke(); label(gx, gy - gh - 10, 'velocity', C.muted, 13); label(gx + gw, gy + 18, 'time', C.muted, 13, 'right');
    g.strokeStyle = C.violet; g.lineWidth = 3; g.beginPath(); const T1 = seg[seg.length - 1].end - t0; for (let i = 0; i <= 100; i++) { const tt = Math.min(lt, T1 * i / 100), vv = v0 + acc * tt * 0.18; const X = gx + gw * tt / T1, Y = gy - Math.min(gh, vv * 22); i ? g.lineTo(X, Y) : g.moveTo(X, Y); } g.stroke();
    panel([[`resultant = ${F} − ${fr} = ${net} N`, net ? C.accent : C.ink, 19], [`mass = ${m} kg`, C.ink, 19], [`a = F / m = ${+(net / m).toFixed(2)} m/s²`, C.violet, 21], ...(a.chapter === 3 ? [['F = m a', C.ink, 30], ...(a.cue === 'example' ? [['30 N ÷ 6 kg = 5 m/s²', C.teal, 21]] : [])] : [])], 400);
  }
};
window.paint = (id, t, tl) => { PAINT[id](t, tl); return true; };
window.grab = (id, t, tl, q) => { PAINT[id](t, tl); return cv.toDataURL('image/jpeg', q || 0.82); };
</script>
</body></html>
